<style>

input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:500;padding:10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:10px;padding:8px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.foot{margin-top:18px;font-size:12.5px;color:var(--muted)}

<script>
(function(){
  var P=JSON.parse(document.getElementById('enc').textContent);
  var b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('consult_pw',pw);}catch(e){}
    document.open(); document.write(html); document.close();
  }
  var f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
  f.addEventListener('submit',async function(ev){ev.preventDefault(); err.style.display='none'; go.disabled=true; go.textContent='여는 중…';
    try{await open(document.getElementById('pw').value);}catch(e){err.style.display='block'; go.disabled=false; go.textContent='열기';}});
  try{var s=sessionStorage.getItem('consult_pw'); if(s) open(s).catch(function(){});}catch(e){}
})();
</script></body></html>
